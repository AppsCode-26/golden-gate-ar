<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Gate AR Card</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0508; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #ffeecd; }
  #ar { position: fixed; inset: 0; }
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, #c1272d 0%, #6b0f18 70%, #2a060b 100%);
  }
  #start h1 { margin: 0; font-size: 34px; letter-spacing: 2px; }
  #start p { margin: 0; max-width: 320px; line-height: 1.45; opacity: .9; }
  button {
    font: inherit; font-weight: 700; font-size: 18px; border: 0; border-radius: 999px; padding: 14px 30px;
    background: #f6be46; color: #4a0a12; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  button.secondary { background: transparent; color: #ffeecd; border: 2px solid #ffeecd55; font-size: 15px; padding: 10px 22px; box-shadow: none; }
  #hint {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 5; background: #000a; padding: 10px 16px;
    border-radius: 999px; font-size: 14px; display: none; white-space: nowrap;
  }
  #credit { position: fixed; left: 0; right: 0; bottom: 8px; z-index: 5; text-align: center; font-size: 10px; opacity: .7; }
  #credit a { color: inherit; }
  #status { font-size: 14px; max-width: 330px; line-height: 1.4; min-height: 1em; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="start" data-version="4">
  <h1>🌉 GOLDEN GATE</h1>
  <div style="font-size:11px;opacity:.6">v4</div>
  <p>Tap start, allow the camera, then point your phone at the QR code (or the bridge picture on the card). Pinch to resize.</p>
  <button id="go">Start AR</button>
  <button id="preview" class="secondary">No card? View in 3D</button>
  <div id="status"></div>
</div>
<div id="ar"></div>
<div id="hint">Point at the QR code 📷 · pinch to resize</div>
<div id="credit">Model: “Golden Gate Bridge 3D Model” by <a href="https://sketchfab.com/damongraphics" target="_blank">damongraphics</a>, <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const statusEl = document.getElementById('status');
const hint = document.getElementById('hint');

// Build the diorama (bridge + Marin headlands + water), scaled so it's a bit wider than the card picture (card width = 1 unit)
const SEA = -22.4; // water level in the model's own units
async function loadBridge() {
  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);
  const gltf = await loader.loadAsync('./bridge.glb?v=4');
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -SEA, -center.z); // center it, water level at y = 0

  const holder = new THREE.Group();
  holder.add(model);
  const water = new THREE.Mesh(
    new THREE.BoxGeometry(size.x * 1.02, 4, size.z * 1.02),
    new THREE.MeshStandardMaterial({ color: 0x2a6a8f, roughness: 0.18, metalness: 0.15 })
  );
  water.position.y = -2.05;
  holder.add(water);
  holder.scale.setScalar(1.2 / size.x);
  return holder;
}

function addLights(scene, renderer) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xfff3e0, 0x334455, 1.2));
  const sun = new THREE.DirectionalLight(0xffe2b0, 2.2);
  sun.position.set(1, 2, 1.5);
  scene.add(sun);
}

// pop-up animation when the card is found
function popIn(obj) {
  const t0 = performance.now();
  const base = obj.userData.baseScale ?? (obj.userData.baseScale = obj.scale.x);
  function step(t) {
    const k = Math.min(1, (t - t0) / 700);
    const e = 1 - Math.pow(1 - k, 3) * Math.cos(k * 4); // springy ease
    obj.scale.setScalar(base * (obj.userData.getUserScale ? obj.userData.getUserScale() : 1) * Math.max(0.001, e));
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// start downloading the AR library + model right away so Start AR is quick
const mindarModule = import('mindar-image-three');
const bridgePromise = loadBridge();
bridgePromise.catch(() => {});

function cameraHelp(e) {
  const name = (e && e.name) || '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return 'This browser can\'t use the camera here. Open this page in Safari (iPhone) or Chrome (Android).';
  if (name === 'NotAllowedError' || name === 'SecurityError')
    return 'Camera is blocked. iPhone: tap "aA" (or the page icon) in the address bar → Website Settings → Camera → Allow, then reload. Also check Settings → Safari → Camera → Ask or Allow.';
  if (name === 'NotReadableError') return 'The camera is busy in another app. Close it and try again.';
  return 'Could not start the camera' + (name ? ' (' + name + ')' : '') + '. Reload and try again.';
}

document.getElementById('go').onclick = async () => {
  statusEl.textContent = 'Asking for the camera…';
  // Ask for the camera FIRST, right inside the tap, so iPhone shows the permission popup
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
    const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } });
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    console.error(e);
    statusEl.textContent = cameraHelp(e);
    return;
  }
  statusEl.textContent = 'Loading…';
  try {
    const { MindARThree } = await mindarModule;
    const mindar = new MindARThree({
      container: document.getElementById('ar'),
      imageTargetSrc: './targets.mind?v=4', maxTrack: 1, warmupTolerance: 2, missTolerance: 10,
      uiScanning: 'no', uiLoading: 'yes',
      filterMinCF: 0.0001, filterBeta: 0.01,
    });
    const { renderer, scene, camera } = mindar;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    addLights(scene, renderer);

    // target 0 = picture inside the card, target 1 = the QR code itself
    const bridge = await bridgePromise;
    bridge.userData.baseScale = bridge.scale.x;
    bridge.rotation.x = Math.PI / 2;        // stand the bridge up out of the paper
    bridge.position.set(0, -0.05, 0);
    const anchors = [mindar.addAnchor(0), mindar.addAnchor(1)];
    for (const a of anchors) {
      a.onTargetFound = () => {
        hint.style.display = 'none';
        bridge.position.set(0, a === anchors[0] ? -0.05 : 0, 0);
        a.group.add(bridge);
        popIn(bridge);
      };
      a.onTargetLost = () => { hint.style.display = 'block'; };
    }

    // pinch with two fingers to resize the bridge
    let pinchStart = 0, scaleStart = 1, userScale = 1;
    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    addEventListener('touchstart', e => { if (e.touches.length === 2) { pinchStart = dist(e.touches); scaleStart = userScale; } }, { passive: true });
    addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStart) {
        userScale = Math.min(4, Math.max(0.3, scaleStart * dist(e.touches) / pinchStart));
        bridge.scale.setScalar(bridge.userData.baseScale * userScale);
      }
    }, { passive: true });
    addEventListener('touchend', e => { if (e.touches.length < 2) pinchStart = 0; });
    bridge.userData.getUserScale = () => userScale;

    await mindar.start();
    document.getElementById('start').style.display = 'none';
    hint.style.display = 'block';
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  } catch (e) {
    console.error(e);
    statusEl.textContent = e ? 'Something went wrong: ' + (e.message || e) : cameraHelp(null);
  }
};

// Fallback: spin the model around without the card
document.getElementById('preview').onclick = async () => {
  statusEl.textContent = 'Loading…';
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('ar').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9cc3e0);
  
  addLights(scene, renderer);
  const bridge = (await bridgePromise).clone();
  scene.add(bridge);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
  camera.position.set(1.0, 0.8, 1.6);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.03, 0);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });
  document.getElementById('start').style.display = 'none';
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
};
</script>
</body>
</html>
